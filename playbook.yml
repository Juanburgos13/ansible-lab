
---
- name: Laboratorio Ansible con Docker
  hosts: docker
  gather_facts: true

  tasks:

    - name: Mostrar nombre del servidor
      ansible.builtin.debug:
        msg: "Nombre del servidor: {{ inventory_hostname }}"

    - name: Mostrar sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

    - name: Crear directorio principal
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        mode: '0644'

    - name: Crear directorios mediante un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "Este servidor utiliza Ubuntu."
      when: ansible_facts["distribution"] == "Ubuntu"
